<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>角色盲测台</title>
    <link rel="stylesheet" href="/character_blind_lab/styles.css">
  </head>
  <body>
    <main class="blind-shell">
      <header class="blind-top">
        <div>
          <h1>角色盲测台</h1>
          <p>每页只看 5 个候选：职业、被动、小技能、大招。先选喜欢的，最后再看提示词和筛查理由。</p>
        </div>
        <div class="top-links">
          <a class="back-link" href="/character_blind_lab/top10.html">Top10 盲选</a>
          <a class="back-link" href="/workbench/">工作台</a>
        </div>
      </header>

      <section class="controls">
        <label>
          候选池
          <select id="runSelect"></select>
        </label>
        <button id="prevBtn" type="button">上一页</button>
        <button id="nextBtn" type="button">下一页</button>
        <button id="revealBtn" type="button">查看已选来源</button>
      </section>

      <section id="cards" class="card-grid" aria-live="polite"></section>
      <section id="revealPanel" class="reveal-panel" hidden></section>
    </main>

    <script src="/character_blind_lab/blind-lab.js"></script>
  </body>
</html>
