<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>候选 Top10 盲选</title>
    <link rel="stylesheet" href="/character_blind_lab/top10.css">
  </head>
  <body>
    <main class="top10-shell">
      <header class="topbar">
        <div>
          <h1>候选 Top10 盲选</h1>
          <p>从全部候选里选 10 个。这里不显示评价 agent 的理由，选完后再对比：旧版综合 Top10、8 个不同评价 prompt，哪个更贴你的审美。</p>
        </div>
        <a href="/character_blind_lab/">返回盲测</a>
      </header>

      <section class="status-row">
        <strong id="countLabel">已选 0 / 10</strong>
        <div class="actions">
          <button id="clearBtn" type="button">清空</button>
          <button id="compareBtn" type="button">对比 agent</button>
        </div>
      </section>

      <section class="layout">
        <aside class="selected-panel">
          <h2>你的选择</h2>
          <ol id="selectedList"></ol>
        </aside>
        <section>
          <div id="cards" class="candidate-grid" aria-live="polite"></div>
        </section>
      </section>

      <section id="comparePanel" class="compare-panel" hidden></section>
    </main>

    <script src="/character_blind_lab/top10.js"></script>
  </body>
</html>
